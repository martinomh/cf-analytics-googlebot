# Stesso servizio, Dockerfile.buster (RUN --security=insecure su pip).
# Preferisci ./build-buster.sh (usa buildx --allow security.insecure; spesso evita errori daemon.json).
# Se usi solo compose: export DOCKER_BUILDKIT=1
#     docker compose -f docker-compose.yml -f docker-compose.buster.yml up -d --build
# e, se serve, builder.entitlements in /etc/docker/daemon.json (README).
#
# Runtime: su kernel/seccomp datati (es. Pi + Buster) Python 3.12 può fallire già su
# import logging (time.time() → PermissionError). seccomp=unconfined risolve solo a runtime.
services:
  cf-googlebot-archiver:
    build:
      context: .
      dockerfile: Dockerfile.buster
    security_opt:
      - seccomp=unconfined
