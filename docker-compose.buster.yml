# Host Debian Buster / seccomp datato: PermissionError su time.time() durante pip.
# 1) /etc/docker/daemon.json → builder.entitlements.security-insecure (vedi README)
# 2) export DOCKER_BUILDKIT=1
# 3) docker compose -f docker-compose.yml -f docker-compose.buster.yml up -d --build
#
# Nota: `build.privileged` non disattiva il sandbox dei singoli RUN in BuildKit; serve Dockerfile.buster
# con `RUN --security=insecure` solo sul passo pip.
services:
  cf-googlebot-archiver:
    build:
      context: .
      dockerfile: Dockerfile.buster
