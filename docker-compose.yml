services:
  cf-googlebot-archiver:
    build: .
    image: cf-googlebot-archiver:local
    ports:
      - "${HTTP_PORT:-418}:418"
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/cf_googlebot.db
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "418"
    volumes:
      - cf_googlebot_sqlite:/data
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:418/health', timeout=5)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  cf_googlebot_sqlite:
